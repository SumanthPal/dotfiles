# --- Prefix & Core ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# --- Neovim Integrations ---
# Required for Neovim's checktime to auto-refresh files changed by Claude
set -g focus-events on

# Smart pane switching to navigate seamlessly between Neovim splits and tmux panes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n "C-\\" if-shell "$is_vim" "send-keys 'C-\\'" "select-pane -l"

# --- UI & Status Bar ---
set -g status-bg black
set -g status-fg white
set -g status-interval 5
set -g status-left "#[fg=green]#S "
set -g status-right "#[fg=yellow]%Y-%m-%d #[fg=cyan]%H:%M "
setw -g window-status-format "#[fg=white] #I:#W "
setw -g window-status-current-format "#[fg=black,bg=green] #I:#W "
set -g pane-border-style fg=gray
set -g pane-active-border-style fg=green
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- AI & Context Workflows ---
# Maintain enough history so massive AI responses never get cut off
set -g history-limit 100000
setw -g mode-keys vi

# Launch Claude Code instantly in a floating scratchpad
bind Enter display-popup -E -w 80% -h 80% "claude"

# Save terminal errors to a file to feed directly into Claude
bind-key P command-prompt -p 'Save history to filename:' -I '~/tmux.history' 'capture-pane -S -32768 ; save-buffer %1 ; delete-buffer'

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
run '~/.tmux/plugins/tpm/tpm'
